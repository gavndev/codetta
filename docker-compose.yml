# Codetta: self-hosted music metadata editor.
#
# 1. Put your settings (music path, PUID/PGID) in docker-compose.override.yml,
#    or edit the values below.
# 2. docker compose up -d   →   open http://<server>:8111 and create your account.
# 3. Update later with: docker compose pull && docker compose up -d
services:
  codetta:
    image: ghcr.io/gavndev/codetta:latest   # or pin a version, e.g. :0.1.0
    container_name: codetta
    restart: unless-stopped
    ports:
      - "8111:8111"
    environment:
      PUID: "1000"   # user that owns your music files (ls -ln /path/to/music)
      PGID: "1000"   # its group
      # Optional: set the account here instead of the setup screen.
      # CODETTA_USERNAME: "you"
      # CODETTA_PASSWORD: "a long password"
      # Optional: turn sign-in off ONLY if a reverse proxy already handles it.
      # CODETTA_AUTH: "off"
      # Optional: Codetta is offline unless you opt in (in the app, or here).
      # CODETTA_MUSICBRAINZ: "on"     # Match on MusicBrainz + cover art
      # CODETTA_OFFLINE: "on"         # never go online, whatever else is set
      # Optional: Soulseek through your slskd (downloads arrive in /inbox below).
      # CODETTA_SLSKD_URL: "http://slskd:5030"
      # CODETTA_SLSKD_API_KEY: "one of slskd's web.authentication.api_keys"
    volumes:
      - /path/to/your/music:/music     # ← your music library (read-write)
      - ./codetta-config:/config       # account, loadouts, activity log, search index
      # Optional: where new music lands (e.g. slskd's downloads), for the import inbox.
      # - /path/to/downloads:/inbox
    # Hardening: no privilege escalation, read-only system files.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
