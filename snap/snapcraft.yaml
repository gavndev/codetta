# The snap: `sudo snap install codetta`, then `codetta` (opens your Music folder in the browser).
# Built for amd64 and arm64 by the snapcraft.io build service on every push to main (edge channel);
# promote a tested build to stable on snapcraft.io. Local build: `snapcraft pack` (needs LXD).
name: codetta
title: Codetta
summary: A private, self-hosted music library manager
description: |
  Codetta looks after a local music library (FLAC, MP3, M4A, OGG, Opus, WAV,
  AIFF, WMA and more) from your browser: edit tags for one track or a whole
  album, match albums on MusicBrainz, batch edit, rename and organize files,
  and undo anything from the activity log.

  Run `codetta` to open your Music folder at http://localhost:8111, or
  `codetta /path/to/music` for another folder. Music on an external drive
  (/media, /mnt) needs: sudo snap connect codetta:removable-media

  No tracking, no ads, and no internet connection until you switch on an
  online feature.
website: https://github.com/gavndev/codetta
source-code: https://github.com/gavndev/codetta
issues: https://github.com/gavndev/codetta/issues
contact: https://github.com/gavndev/codetta/issues
license: AGPL-3.0-or-later
icon: src/codetta/web/static/icons/codetta.png
adopt-info: codetta
base: core26   # Ubuntu 26.04: Python 3.14
grade: stable
confinement: strict
platforms:
  amd64:
  arm64:

apps:
  codetta:
    command: bin/codetta
    plugs:
      - home             # your Music folder
      - removable-media  # music on /media or /mnt (connect it by hand, see above)
      - network          # MusicBrainz and the other opt-in lookups
      - network-bind     # serve the page

parts:
  ffmpeg:
    # The same tiny ffmpeg as the Docker image (ReplayGain's loudness meter, and converting songs for
    # music apps): see docker/ffmpeg-configure.sh.
    plugin: nil
    source: https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz
    source-checksum: sha256/1a4d394ae63d190a526cd052eb4415c156b5c5e2df37efab41a7de0b8fde2433
    build-packages: [build-essential, pkg-config, libmp3lame-dev, libopus-dev]  # pkg-config: how ffmpeg finds libopus
    stage-packages: [libmp3lame0, libopus0]
    override-build: |
      sh "$CRAFT_PROJECT_DIR/docker/ffmpeg-configure.sh"
      make -j"$CRAFT_PARALLEL_BUILD_COUNT" ffmpeg
      strip ffmpeg
      install -D -m 755 ffmpeg "$CRAFT_PART_INSTALL/bin/ffmpeg"

  codetta:
    plugin: python
    source: .
    python-constraints:
      - pins.txt         # uv.lock's exact versions (written by override-pull below)
    stage-packages:
      - python3-venv     # core26 has the standard library but no python3 program
    override-pull: |
      craftctl default
      craftctl set version="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
      python3 tools/lockpins.py uv.lock > pins.txt
