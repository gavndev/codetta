<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Schibsted Grotesk";src:url(schibsted-grotesk.woff2) format("woff2");font-weight:400 900}
:root{--bg:#f7f8f8;--ink:#1b1e24;--muted:#59606d;--spot:#0e7c74;--rule:#1b1e24;--card:#fff;--shadow:0 1px 2px rgba(20,22,28,.06),0 18px 40px -12px rgba(20,22,28,.28)}
:root[data-theme=dark]{--bg:#131418;--ink:#f0f0ec;--muted:#a4a9b4;--spot:#4fc3b4;--rule:#f0f0ec;--card:#1a1c21;--shadow:0 1px 2px rgba(0,0,0,.4),0 22px 48px -12px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:640px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,sans-serif}
.wrap{position:relative;height:100%;display:grid;grid-template-columns:820px 1fr}
.copy{padding:172px 0 0 150px;display:flex;flex-direction:column;z-index:2}
.logo{height:56px;width:auto;align-self:flex-start}
h1{margin-top:44px;font-size:64px;line-height:1.0;font-weight:800;letter-spacing:-.035em}
p.sub{margin-top:26px;font-size:21px;line-height:1.45;color:var(--muted);max-width:430px}
ul{list-style:none;padding:0;margin-top:40px;border-top:1.5px solid var(--rule);max-width:430px}
li{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid color-mix(in oklab,var(--ink) 14%,transparent);font-size:17px}
li b{font-weight:700}
li span{color:var(--muted);font-variant-numeric:tabular-nums}
.foot{margin-top:auto;padding-bottom:64px;font-size:15px;color:var(--muted);letter-spacing:.01em;display:flex;gap:18px;white-space:nowrap}
.foot i{font-style:normal;color:var(--spot);font-weight:700}
.wall{position:absolute;left:900px;top:-330px;right:-40px;bottom:-200px;display:grid;grid-template-columns:repeat(4,250px);gap:34px;transform:rotate(-6deg);transform-origin:40% 50%}
.col{display:flex;flex-direction:column;gap:30px}
.col:nth-child(2){margin-top:-130px}.col:nth-child(3){margin-top:60px}.col:nth-child(4){margin-top:-60px}
.alb img{width:250px;height:250px;display:block;border-radius:4px;box-shadow:var(--shadow);object-fit:cover}
.alb .t{margin-top:12px;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fade{position:absolute;inset:0 auto 0 800px;width:200px;background:linear-gradient(90deg,var(--bg) 15%,transparent);z-index:1}
</style></head><body><div class="wrap">
<div class="copy">
 <img class="logo" id="logo" src="logo-light.svg" alt="codetta">
 <h1>Your music library,<br>looked after.</h1>
 <p class="sub">Fix tags, match albums on MusicBrainz and organize your files, from any browser.</p>
 
 
</div>
<div class="fade"></div>
<div class="wall" id="wall"></div>
</div>
<script>
const dark = location.hash.includes("dark"), anim = location.hash.includes("anim");
if (dark) { document.documentElement.dataset.theme = "dark"; document.getElementById("logo").src = "logo-dark.svg"; }
fetch("albums.json").then(r => r.json()).then(list => {
  const wall = document.getElementById("wall");
  for (let c = 0; c < 4; c++) {
    const col = document.createElement("div"); col.className = "col";
    for (let r = 0; r < 3; r++) {
      const a = list[c * 3 + r];
      const el = document.createElement("div"); el.className = "alb";
      el.innerHTML = `<img src="${a.c}"><div class="t"></div><div class="a"></div>`;
      el.querySelector(".t").textContent = a.t; el.querySelector(".a").textContent = `${a.a} · ${a.y}`;
      col.append(el);
    }
    wall.append(col);
  }
  if (anim) {
    // Covers drop in one by one (row by row, across the columns), hold, then fade for the loop.
    const items = [];
    [...wall.children].forEach((col, c) => [...col.children].forEach((el, r) => items.push({ el, k: r * 3 + c })));
    const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
    window.LOOP = 7.0;
    window.setT = (t) => {
      const out = t > 6.3 ? ease((t - 6.3) / 0.6) : 0;
      for (const { el, k } of items) {
        const p = ease((t - 0.2 - k * 0.12) / 0.6);
        el.style.opacity = String(p * (1 - out));
        el.style.transform = `translateY(${(1 - p) * 28}px) scale(${0.96 + 0.04 * p})`;
      }
    };
    window.setT(0);
  }
  document.body.dataset.ready = "1";
});
</script></body></html>
