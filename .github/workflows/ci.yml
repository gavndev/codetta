# Runs the tests and checks that the Docker image builds and starts.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # 3.14: the snap (core26) and many pipx installs. 3.15: the Docker image.
        python: ["3.14", "3.15"]
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ffmpeg, so the ReplayGain tests run too
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t codetta:ci .
      - name: fpcalc runs in the image (Identify by sound)
        run: docker run --rm --entrypoint fpcalc codetta:ci -version
      - name: ffmpeg measures loudness of every format in the image (ReplayGain)
        run: |
          docker run --rm --entrypoint sh codetta:ci -c 'ls -lh /usr/local/bin/ffmpeg'
          for f in sample.flac sample.mp3 sample.m4a sample.ogg sample.opus sample.wav sample.aiff sample.wv sample.wma sample.dsf sample.tta sample.mp2 sample.m4b sample.oga sample.ape sample.mpc sample.dff; do
            echo "== $f"
            docker run --rm -v "$PWD/tests/fixtures:/f:ro" --entrypoint ffmpeg codetta:ci \
              -nostdin -hide_banner -nostats -i "/f/$f" -map 0:a:0 -af ebur128=peak=sample -f null - 2>&1 | grep -E "I:|Peak:" | tail -2 \
              | grep -q "Peak:" || { echo "ffmpeg couldn't measure $f"; exit 1; }
          done
      - name: Start it and wait until healthy
        run: |
          mkdir -p music config && sudo chown 1000:1000 music config
          docker run -d --name codetta --read-only --tmpfs /tmp --security-opt no-new-privileges:true \
            -e PUID=1000 -e PGID=1000 -v "$PWD/music:/music" -v "$PWD/config:/config" -p 8111:8111 codetta:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' codetta)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs codetta
          curl -fsS http://localhost:8111/api/health
          test "$(docker inspect -f '{{.State.Health.Status}}' codetta)" = healthy
