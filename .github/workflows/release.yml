# Publishing a release: push a tag like v0.1.0 and this workflow
#   1. runs the tests,
#   2. builds the image for Intel/AMD and ARM servers and pushes it to
#      ghcr.io/gavndev/codetta (tags: 0.1.0, 0.1, latest),
#   3. creates the GitHub release with that version's notes from CHANGELOG.md,
#   4. publishes the Python package to PyPI (`pipx install codetta`), once it's switched on:
#      on pypi.org add a "trusted publisher" (project codetta, this repo, workflow release.yml,
#      environment pypi), then set the repository variable PYPI_PUBLISH to true.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the release
  packages: write   # push the image

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the version in pyproject.toml
        run: |
          want="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          test "${GITHUB_REF_NAME#v}" = "$want" || { echo "Tag $GITHUB_REF_NAME != version $want"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section that starts with "## <version>" up to the next "## ".
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          printf '\n---\n**Install or update:** `docker compose pull && docker compose up -d` (image `ghcr.io/%s:%s`)\n' \
            "$GITHUB_REPOSITORY" "$version" >> notes.md
          if [ "${{ vars.PYPI_PUBLISH }}" = "true" ]; then
            printf '\nOn your own computer: `pipx install codetta` (update: `pipx upgrade codetta`)\n' >> notes.md
          fi
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "Codetta ${GITHUB_REF_NAME#v}" --notes-file notes.md $flags

  pypi:
    needs: image   # after the tests and the tag/version check
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing: no PyPI password stored anywhere
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build the package
        run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
