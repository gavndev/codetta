# Publishing a release: push a tag like v0.1.0 and this workflow
#   1. runs the tests,
#   2. builds the image for Intel/AMD and ARM servers (each on its own native machine) and pushes it to
#      ghcr.io/gavndev/codetta (tags: 0.1.0, 0.1, latest),
#
# A test build: give the tag a suffix, like v0.9.2-rc.1 (with version "0.9.2rc1" in
# pyproject.toml). It becomes a GitHub pre-release, the image is tagged 0.9.2-rc.1 and
# beta (never latest), PyPI marks it as a pre-release (pipx skips it unless asked), and the
# snap goes to the beta channel instead of stable. Codetta's update check ignores it.
#
#   3. creates the GitHub release with that version's notes from CHANGELOG.md,
#   4. publishes the Python package to PyPI (`pipx install codetta`), once it's switched on:
#      on pypi.org add a "trusted publisher" (project codetta, this repo, workflow release.yml,
#      environment pypi), then set the repository variable PYPI_PUBLISH to true,
#   5. builds the snap for Intel/AMD and ARM and releases both to the Snap Store's stable
#      channel, once it's switched on: save a store login as the secret SNAPCRAFT_STORE_CREDENTIALS
#      (`snapcraft export-login`, limited to the codetta snap) and set SNAP_PUBLISH to true.
#      (snapcraft.io's own build service keeps building every push to main for the edge channel.)
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the release
  packages: write   # push the image

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install, at the versions in uv.lock
        run: python tools/lockpins.py > "$RUNNER_TEMP/pins.txt" && pip install -c "$RUNNER_TEMP/pins.txt" -e ".[dev]"
      - name: The tag matches the version in pyproject.toml
        run: |
          pip install -q packaging
          python - <<'PY'
          import os, tomllib
          from packaging.version import Version
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]["version"]
          if Version(tag) != Version(project):
              raise SystemExit(f"Tag v{tag} doesn't match version {project} in pyproject.toml: bump it first.")
          print(f"v{tag} matches pyproject.toml ({project})")
          PY
      - run: pytest -q

  # Each half of the image is built on its own kind of machine (no slow ARM emulation:
  # compiling the small ffmpeg under emulation took most of 12+ minutes), pushed without a
  # tag, and the "image" job below joins the two halves under the version tags.
  image-build:
    needs: tests
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version in pyproject.toml
        run: |
          want="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          test "${GITHUB_REF_NAME#v}" = "$want" || { echo "Tag $GITHUB_REF_NAME != version $want"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - name: Remember this half's digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  image:
    needs: image-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
      - name: Join both halves under the version tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          test "$(ls | wc -l)" = 2 || { echo "expected 2 image halves, got: $(ls)"; exit 1; }
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: Both architectures are there
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}" | tee inspect.txt
          grep -q 'linux/amd64' inspect.txt && grep -q 'linux/arm64' inspect.txt

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section that starts with "## <version>" up to the next "## ".
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          printf '\n---\n**Install or update:** `docker compose pull && docker compose up -d` (image `ghcr.io/%s:%s`)\n' \
            "$GITHUB_REPOSITORY" "$version" >> notes.md
          if [ "${{ vars.PYPI_PUBLISH }}" = "true" ]; then
            printf '\nOn your own computer: `pipx install codetta` (update: `pipx upgrade codetta`)\n' >> notes.md
          fi
          printf 'On Ubuntu and other Linux: `sudo snap install codetta` (snaps update themselves)\n' >> notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "Codetta ${GITHUB_REF_NAME#v}" --notes-file notes.md $flags

  pypi:
    needs: image   # after the tests and the tag/version check
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing: no PyPI password stored anywhere
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build the package
        run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  snap:
    needs: image   # after the tests and the tag/version check
    if: vars.SNAP_PUBLISH == 'true'
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]   # amd64 and arm64, each built natively
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: snapcore/action-build@v1
        id: build
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}
