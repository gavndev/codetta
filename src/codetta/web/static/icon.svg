<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Codetta's mark: the musical coda sign, flat. Black on light, white on dark. -->
  <style>
    .mark { stroke: #1d1d1f; }
    @media (prefers-color-scheme: dark) { .mark { stroke: #f5f5f7; } }
  </style>
  <g class="mark" stroke-width="3.4">
    <circle cx="16" cy="16" r="9.8"/>
    <path d="M16 1v30M1 16h30"/>
  </g>
</svg>
