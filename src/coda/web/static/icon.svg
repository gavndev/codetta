<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke-linecap="round">
  <!-- Coda's mark: the musical coda sign (an oval crossed by two lines).
       Black on light browser chrome, white on dark. -->
  <style>
    .mark { stroke: #1d1d1f; }
    @media (prefers-color-scheme: dark) { .mark { stroke: #f5f5f7; } }
  </style>
  <g class="mark">
    <ellipse cx="16" cy="16" rx="7" ry="9" stroke-width="2.6"/>
    <path d="M16 2.5v27M2.5 16h27" stroke-width="2"/>
  </g>
</svg>
