[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codetta"
version = "0.9.1"
description = "A private, self-hosted music library manager: tags, MusicBrainz matching, batch editing and organizing, in your browser"
readme = "README.md"
authors = [{ name = "gavndev" }]
keywords = ["music", "tags", "tagger", "metadata", "musicbrainz", "flac", "id3", "self-hosted", "library", "organizer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "mutagen>=1.48",
    "fastapi>=0.163",
    "uvicorn>=0.54",
]

[project.urls]
Homepage = "https://github.com/gavndev/codetta"
Documentation = "https://github.com/gavndev/codetta/tree/main/docs"
Changelog = "https://github.com/gavndev/codetta/blob/main/CHANGELOG.md"
Issues = "https://github.com/gavndev/codetta/issues"

[project.scripts]
codetta = "codetta.cli.run:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "httpx2>=2.16",  # used by FastAPI's TestClient
    "hypothesis>=6.100",  # generated round-trip tests (tests/test_roundtrip.py)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codetta = ["web/static/*", "web/static/fonts/*", "web/static/icons/*", "web/static/js/*", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
